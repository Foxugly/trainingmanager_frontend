name: Test & Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Unit tests (Vitest)
        run: npm test
      - name: Build (validate compile)
        run: npm run build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write    # mint the OIDC token to assume the deploy role
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci

      # The commit SHA is frozen into the bundle (src/app/core/build-info.ts):
      # the Sentry release becomes tm-frontend@<sha> and wins over the SSM
      # SENTRY_RELEASE value.
      - name: Build (production)
        env:
          BUILD_SHA: ${{ github.sha }}
        run: npm run build -- --define "TM_BUILD_SHA='${BUILD_SHA}'"

      - name: Verify build output
        run: test -f dist/trainingmanager-frontend/browser/index.html

      - name: Precompress assets (brotli + gzip)
        run: node scripts/precompress.mjs

      - name: Package bundle
        id: pkg
        run: |
          tar -czf frontend-build.tar.gz -C dist/trainingmanager-frontend/browser .
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
          role-session-name: gh-actions-${{ github.run_id }}

      - name: Upload bundle to S3
        # Namespaced under builds/tm-frontend/ so this app can share an existing
        # fleet deploy bucket (foxugly-deploy) without colliding with its builds.
        run: |
          aws s3 cp frontend-build.tar.gz \
            "s3://${{ secrets.S3_DEPLOY_BUCKET }}/builds/tm-frontend/${{ steps.pkg.outputs.sha }}.tar.gz"

      - name: Deploy on EC2 via SSM
        id: ssm
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          BUCKET: ${{ secrets.S3_DEPLOY_BUCKET }}
          SHA: ${{ steps.pkg.outputs.sha }}
        run: |
          # AWS-RunShellScript runs as ROOT. Steps:
          #  1. heal ownership; 2. (django, umask 027) git reset → refresh deploy
          #  artifacts; 3-5. install unit / root fetch-script / nginx vhost from
          #  the COMMITTED git blob (never the django tree → §3.10); 6. enable
          #  unit; 7. pull the bundle from S3 via the instance role (blank the
          #  certbot creds so the role is used) and atomic-swap it into the
          #  NB le docroot garde UNE generation de chunks en plus de la
          #  courante. Sans cela `rsync --delete` effacait les anciens chunks a
          #  chaque deploiement, et un onglet ouvert avant le deploiement
          #  reclamait un fichier disparu des que son proprietaire naviguait
          #  vers une route pas encore visitee (TM-FRONTEND-5). .bundle-current
          #  et .bundle-prev sont des copies PURES du bundle, pas du docroot,
          #  sinon la retention s'empilerait indefiniment ; le
          #  `--ignore-existing` garantit que l'ancienne generation n'ecrase
          #  jamais la nouvelle (index.html et i18n en particulier).
          #  docroot; 8. restart the runtime-fetch unit (writes the SSM snippet;
          #  it only reloads nginx when the snippet CHANGED); 8b. unconditional
          #  `nginx -t && reload` so vhost edits in this commit always take
          #  effect; 9. normalise perms.
          APP=/var/www/django_websites/trainingmanager_frontend
          DOC="$APP/dist/trainingmanager-frontend/browser"
          # Root lit les blobs qu'il installe dans SON PROPRE miroir nu (root:root 700),
          # alimente depuis GitHub au SHA deploye — jamais dans le checkout django, dont
          # .git (refs, config, hooks) est reecrivable par django (escalade vers root).
          M=/var/lib/fleet-deploy/trainingmanager_frontend.git
          GB="git --git-dir=$M show $SHA"
          # Ecritures dans l'arbre de django = EN DJANGO (§3.10). django possede
          # $APP : il pourrait y planter un lien symbolique pour qu'un rsync/tar/mv
          # de root ecrive dans /etc. Root ne fait donc que ce qui exige root
          # (miroir, units, nginx, systemctl). Le bundle S3, telecharge par root
          # (role d'instance) dans un mktemp -d prive (700), est passe a django sur
          # stdin (redirection ouverte par root) et extrait par django dans
          # dist/.bundle-new AVANT toute rotation (echec = arret, docroot intact),
          # puis tourne et publie par django. chown -R -h ne suit aucun lien ;
          # le chmod final tourne en django.
          cat > /tmp/ssm-params.json <<EOF
          { "commands": [
            "chown -R -h django:www-data $APP",
            "sudo -u django bash -c 'umask 027; cd $APP && git fetch --quiet origin main && git reset --hard --quiet origin/main'",
            "install -d -m 700 -o root -g root /var/lib/fleet-deploy",
            "[ -d $M ] || git init --quiet --bare $M",
            "git --git-dir=$M fetch --quiet --depth=1 https://github.com/Foxugly/trainingmanager_frontend.git $SHA && git --git-dir=$M cat-file -e $SHA^{commit} || exit 1",
            "$GB:deploy/systemd/tm-frontend-runtime-fetch.service > /etc/systemd/system/tm-frontend-runtime-fetch.service",
            "$GB:deploy/fetch-frontend-runtime-from-ssm.sh > /usr/local/sbin/tm-frontend-runtime-fetch.sh && chmod 0755 /usr/local/sbin/tm-frontend-runtime-fetch.sh && chown root:root /usr/local/sbin/tm-frontend-runtime-fetch.sh",
            "$GB:deploy/nginx/tm-frontend.conf > /etc/nginx/sites-available/tm-frontend.conf && ln -sf /etc/nginx/sites-available/tm-frontend.conf /etc/nginx/sites-enabled/tm-frontend.conf",
            "systemctl daemon-reload && systemctl enable --quiet tm-frontend-runtime-fetch",
            "T=\$(mktemp -d) || exit 1",
            "env AWS_SHARED_CREDENTIALS_FILE=/dev/null AWS_CONFIG_FILE=/dev/null aws s3 cp s3://$BUCKET/builds/tm-frontend/$SHA.tar.gz \$T/tmfe.tar.gz --region eu-west-1",
            "sudo -u django sh -c 'umask 027; mkdir -p $APP/dist && rm -rf $APP/dist/.bundle-new && mkdir $APP/dist/.bundle-new && tar --no-same-owner --no-overwrite-dir -xzf - -C $APP/dist/.bundle-new' < \$T/tmfe.tar.gz || exit 1",
            "sudo -u django sh -c 'rm -rf $APP/dist/.bundle-prev; [ -d $APP/dist/.bundle-current ] && mv $APP/dist/.bundle-current $APP/dist/.bundle-prev || true'",
            "sudo -u django sh -c 'rm -rf $APP/dist/.bundle-current && mv $APP/dist/.bundle-new $APP/dist/.bundle-current'",
            "sudo -u django sh -c 'umask 027; mkdir -p $DOC && rsync -a --delete $APP/dist/.bundle-current/ $DOC/'",
            "sudo -u django sh -c '[ -d $APP/dist/.bundle-prev ] && rsync -a --ignore-existing $APP/dist/.bundle-prev/ $DOC/ || true'",
            "rm -rf \$T",
            "systemctl restart tm-frontend-runtime-fetch",
            "nginx -t && systemctl reload nginx",
            "chown -R -h django:www-data $APP && sudo -u django chmod -R g-w,o-rwx $APP"
          ], "executionTimeout": ["900"] }
          EOF
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy tm-frontend ${{ github.sha }}" \
            --cloud-watch-output-config CloudWatchOutputEnabled=true \
            --parameters file:///tmp/ssm-params.json \
            --query Command.CommandId --output text)
          echo "cmd_id=$CMD_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM command
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          CMD_ID: ${{ steps.ssm.outputs.cmd_id }}
        run: |
          for _ in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success) aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text; exit 0 ;;
              Failed|Cancelled|TimedOut)
                echo "Deploy $STATUS"
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
                exit 1 ;;
              *) sleep 5 ;;
            esac
          done
          echo "Timed out"; exit 1

      - name: Smoke test
        run: |
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 30 -I https://tm.foxugly.com/ > /dev/null; then
              echo "Deployment OK (attempt $attempt)"; exit 0
            fi
            echo "attempt $attempt failed, retrying in 5s..."; sleep 5
          done
          echo "Smoke test failed"; exit 1
