name: Test & Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Unit tests (Vitest)
        run: npm test
      - name: Build (validate compile)
        run: npm run build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write    # mint the OIDC token to assume the deploy role
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci

      - name: Build (production)
        run: npm run build

      - name: Verify build output
        run: test -f dist/trainingmanager-frontend/browser/index.html

      - name: Precompress assets (brotli + gzip)
        run: node scripts/precompress.mjs

      - name: Package bundle
        id: pkg
        run: |
          tar -czf frontend-build.tar.gz -C dist/trainingmanager-frontend/browser .
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
          role-session-name: gh-actions-${{ github.run_id }}

      - name: Upload bundle to S3
        # Namespaced under builds/tm-frontend/ so this app can share an existing
        # fleet deploy bucket (foxugly-deploy) without colliding with its builds.
        run: |
          aws s3 cp frontend-build.tar.gz \
            "s3://${{ secrets.S3_DEPLOY_BUCKET }}/builds/tm-frontend/${{ steps.pkg.outputs.sha }}.tar.gz"

      - name: Deploy on EC2 via SSM
        id: ssm
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          BUCKET: ${{ secrets.S3_DEPLOY_BUCKET }}
          SHA: ${{ steps.pkg.outputs.sha }}
        run: |
          # AWS-RunShellScript runs as ROOT. Steps:
          #  1. heal ownership; 2. (django, umask 027) git reset → refresh deploy
          #  artifacts; 3-5. install unit / root fetch-script / nginx vhost from
          #  the COMMITTED git blob (never the django tree → §3.10); 6. enable
          #  unit; 7. pull the bundle from S3 via the instance role (blank the
          #  certbot creds so the role is used) and atomic-swap it into the
          #  docroot; 8. restart the runtime-fetch unit (writes the SSM snippet;
          #  it only reloads nginx when the snippet CHANGED); 8b. unconditional
          #  `nginx -t && reload` so vhost edits in this commit always take
          #  effect; 9. normalise perms.
          APP=/var/www/django_websites/trainingmanager_frontend
          DOC="$APP/dist/trainingmanager-frontend/browser"
          GB="git -C $APP -c safe.directory=$APP show origin/main"
          cat > /tmp/ssm-params.json <<EOF
          { "commands": [
            "chown -R django:www-data $APP",
            "sudo -u django bash -c 'umask 027; cd $APP && git fetch --quiet origin main && git reset --hard --quiet origin/main'",
            "$GB:deploy/systemd/tm-frontend-runtime-fetch.service > /etc/systemd/system/tm-frontend-runtime-fetch.service",
            "$GB:deploy/fetch-frontend-runtime-from-ssm.sh > /usr/local/sbin/tm-frontend-runtime-fetch.sh && chmod 0755 /usr/local/sbin/tm-frontend-runtime-fetch.sh && chown root:root /usr/local/sbin/tm-frontend-runtime-fetch.sh",
            "$GB:deploy/nginx/tm-frontend.conf > /etc/nginx/sites-available/tm-frontend.conf && ln -sf /etc/nginx/sites-available/tm-frontend.conf /etc/nginx/sites-enabled/tm-frontend.conf",
            "systemctl daemon-reload && systemctl enable --quiet tm-frontend-runtime-fetch",
            "env AWS_SHARED_CREDENTIALS_FILE=/dev/null AWS_CONFIG_FILE=/dev/null aws s3 cp s3://$BUCKET/builds/tm-frontend/$SHA.tar.gz /tmp/tmfe.tar.gz --region eu-west-1",
            "rm -rf /tmp/tmfe && mkdir -p /tmp/tmfe && tar -xzf /tmp/tmfe.tar.gz -C /tmp/tmfe && mkdir -p $DOC && rsync -a --delete /tmp/tmfe/ $DOC/ && rm -rf /tmp/tmfe /tmp/tmfe.tar.gz",
            "systemctl restart tm-frontend-runtime-fetch",
            "nginx -t && systemctl reload nginx",
            "chown -R django:www-data $APP && chmod -R g-w,o-rwx $APP"
          ], "executionTimeout": ["900"] }
          EOF
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy tm-frontend ${{ github.sha }}" \
            --cloud-watch-output-config CloudWatchOutputEnabled=true \
            --parameters file:///tmp/ssm-params.json \
            --query Command.CommandId --output text)
          echo "cmd_id=$CMD_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM command
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          CMD_ID: ${{ steps.ssm.outputs.cmd_id }}
        run: |
          for _ in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success) aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text; exit 0 ;;
              Failed|Cancelled|TimedOut)
                echo "Deploy $STATUS"
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
                exit 1 ;;
              *) sleep 5 ;;
            esac
          done
          echo "Timed out"; exit 1

      - name: Smoke test
        run: |
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 30 -I https://tm.foxugly.com/ > /dev/null; then
              echo "Deployment OK (attempt $attempt)"; exit 0
            fi
            echo "attempt $attempt failed, retrying in 5s..."; sleep 5
          done
          echo "Smoke test failed"; exit 1
