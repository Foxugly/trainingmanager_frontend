<div class="page page--narrow">
  <app-page-header [title]="(segmentId() ? 'admin.energy_segments.form.edit_title' : 'admin.energy_segments.form.new_title') | transloco">
    <p-button
      slot="left"
      type="button"
      severity="secondary"
      [outlined]="true"
      icon="pi pi-arrow-left"
      [label]="'common.back' | transloco"
      [routerLink]="['/admin/energy-segments']"
    />
    @if (segmentId()) {
      <app-status-badge
        slot="title-after"
        [kind]="activeValue() ? 'active' : 'inactive'"
        [label]="(activeValue() ? 'common.active' : 'common.inactive') | transloco"
      />
    }
    @if (segmentId()) {
      <app-active-toggle
        slot="right"
        [entityId]="segmentId()!"
        [value]="activeValue()"
        [patch]="patchActive"
        [labels]="activeLabels()"
        (valueChange)="activeValue.set($event)"
      />
    }
  </app-page-header>

  <div class="card form-card">
    <form [formGroup]="form">
      <div class="meta-grid">
        <app-meta-field
          [label]="'admin.energy_segments.form.abv' | transloco"
          [for]="'abv'"
          [error]="fieldError('abv')"
        >
          <input pInputText id="abv" formControlName="abv" placeholder="Z1" class="w-full" />
        </app-meta-field>

        <app-meta-field
          [label]="'admin.energy_segments.form.energy_system' | transloco"
          [for]="'energy_system_id'"
          [error]="fieldError('energy_system_id')"
        >
          <p-select
            inputId="energy_system_id"
            [options]="availableEnergySystems()"
            formControlName="energy_system_id"
            optionLabel="name"
            optionValue="id"
            [placeholder]="'admin.energy_segments.form.energy_system_placeholder' | transloco"
            styleClass="w-full"
          />
        </app-meta-field>

        <app-meta-field
          [full]="true"
          [label]="'admin.energy_segments.form.description' | transloco"
          [error]="fieldError('description')"
        >
          <p-tabs value="fr" class="builder-tabs">
            <p-tablist>
              <p-tab value="fr">FR</p-tab>
              <p-tab value="nl">NL</p-tab>
              <p-tab value="en">EN</p-tab>
              <p-tab value="it">IT</p-tab>
              <p-tab value="es">ES</p-tab>
            </p-tablist>
            <p-tabpanels>
              <p-tabpanel value="fr">
                <textarea pTextarea formControlName="description_fr" rows="3" placeholder="Français" class="w-full"></textarea>
              </p-tabpanel>
              <p-tabpanel value="nl">
                <textarea pTextarea formControlName="description_nl" rows="3" placeholder="Nederlands" class="w-full"></textarea>
              </p-tabpanel>
              <p-tabpanel value="en">
                <textarea pTextarea formControlName="description_en" rows="3" placeholder="English" class="w-full"></textarea>
              </p-tabpanel>
              <p-tabpanel value="it">
                <textarea pTextarea formControlName="description_it" rows="3" placeholder="Italiano" class="w-full"></textarea>
              </p-tabpanel>
              <p-tabpanel value="es">
                <textarea pTextarea formControlName="description_es" rows="3" placeholder="Español" class="w-full"></textarea>
              </p-tabpanel>
            </p-tabpanels>
          </p-tabs>
        </app-meta-field>
      </div>
    </form>

    <app-form-footer
      [saving]="saving()"
      [disabled]="form.invalid"
      [cancelLabel]="'common.cancel' | transloco"
      [saveLabel]="'common.save' | transloco"
      (cancel)="cancel()"
      (save)="submit()"
    />
  </div>

  <p-confirmDialog />
</div>
