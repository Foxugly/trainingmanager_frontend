<div class="page page--narrow">
  <app-page-header [title]="(sportId() ? 'admin.sports.form.edit_title' : 'admin.sports.form.new_title') | transloco">
    <p-button
      slot="left"
      type="button"
      severity="secondary"
      [outlined]="true"
      icon="pi pi-arrow-left"
      [label]="'common.back' | transloco"
      [routerLink]="['/admin/sports']"
    />
    @if (sportId()) {
      <app-status-badge
        slot="title-after"
        [kind]="activeValue() ? 'active' : 'inactive'"
        [label]="(activeValue() ? 'common.active' : 'common.inactive') | transloco"
      />
    }
    @if (sportId()) {
      <app-active-toggle
        slot="right"
        [entityId]="sportId()!"
        [value]="activeValue()"
        [patch]="patchActive"
        [labels]="activeLabels()"
        (valueChange)="activeValue.set($event)"
      />
    }
    @if (sportId()) {
      <p-button
        slot="right"
        type="button"
        severity="secondary"
        [outlined]="true"
        icon="pi pi-tags"
        [pTooltip]="'admin.sports.form.manage_modalities' | transloco"
        tooltipPosition="bottom"
        [ariaLabel]="'admin.sports.form.manage_modalities' | transloco"
        [routerLink]="['/admin/sports', sportId(), 'modalities']"
      />
    }
  </app-page-header>

  <div class="card form-card">
    <form [formGroup]="form">
      <div class="meta-grid">
        <app-meta-field #slugField [label]="'admin.sports.form.slug' | transloco" for="slug" [error]="fieldError('slug')">
          <input pInputText id="slug" formControlName="slug"
            [attr.aria-describedby]="fieldError('slug') ? slugField.errorId() : null" />
        </app-meta-field>
        <app-meta-field [label]="'admin.sports.form.energy_systems' | transloco">
          <p-multiSelect
            [options]="availableEnergySystems()"
            formControlName="energy_systems"
            optionLabel="name"
            optionValue="id"
            [filter]="true"
            [placeholder]="'admin.sports.form.energy_systems_placeholder' | transloco"
          />
        </app-meta-field>
        <app-meta-field [label]="'admin.sports.default_training_type' | transloco" for="default_training_type">
          <p-select
            inputId="default_training_type"
            [options]="trainingTypeOptions()"
            formControlName="default_training_type"
            optionLabel="label"
            optionValue="value"
          />
        </app-meta-field>
        <app-meta-field [full]="true" [label]="'admin.sports.fields.name' | transloco">
          <p-tabs value="fr" class="builder-tabs">
            <p-tablist>
              <p-tab value="fr">FR</p-tab>
              <p-tab value="nl">NL</p-tab>
              <p-tab value="en">EN</p-tab>
              <p-tab value="it">IT</p-tab>
              <p-tab value="es">ES</p-tab>
            </p-tablist>
            <p-tabpanels>
              <p-tabpanel value="fr"><input pInputText formControlName="name_fr" placeholder="Français" class="sports-form__input" /></p-tabpanel>
              <p-tabpanel value="nl"><input pInputText formControlName="name_nl" placeholder="Nederlands" class="sports-form__input" /></p-tabpanel>
              <p-tabpanel value="en"><input pInputText formControlName="name_en" placeholder="English" class="sports-form__input" /></p-tabpanel>
              <p-tabpanel value="it"><input pInputText formControlName="name_it" placeholder="Italiano" class="sports-form__input" /></p-tabpanel>
              <p-tabpanel value="es"><input pInputText formControlName="name_es" placeholder="Español" class="sports-form__input" /></p-tabpanel>
            </p-tabpanels>
          </p-tabs>
        </app-meta-field>
      </div>
      @if (form.errors?.['nameRequired'] && form.dirty) {
        <small class="sports-form__error">{{ 'admin.common.name_required' | transloco }}</small>
      }
    </form>

    <app-form-footer
      [saving]="saving()"
      [disabled]="form.invalid"
      [cancelLabel]="'common.cancel' | transloco"
      [saveLabel]="'common.save' | transloco"
      (cancel)="cancel()"
      (save)="submit()"
    />
  </div>

  <p-confirmDialog />
</div>
