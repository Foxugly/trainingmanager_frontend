<div class="energy-systems-list__head">
  <h1 class="energy-systems-list__title">{{ 'admin.energy_systems.title' | transloco }}</h1>
  <a [routerLink]="['new']">
    <p-button [label]="'admin.energy_systems.new' | transloco" icon="pi pi-plus" severity="success" />
  </a>
</div>

<div class="energy-systems-list__filter">
  <p-checkbox
    [(ngModel)]="includeInactiveModel"
    [binary]="true"
    inputId="es_include_inactive"
  />
  <label for="es_include_inactive" class="energy-systems-list__filter-label" style="color: var(--p-text-color)">
    {{ 'admin.energy_systems.show_inactive' | transloco }}
  </label>
</div>

<p-table
  [value]="energySystems()"
  [loading]="loading()"
  [paginator]="true"
  [rows]="20"
  styleClass="energy-systems-list__table"
>
  <ng-template pTemplate="header">
    <tr>
      <th>{{ 'admin.energy_systems.fields.name' | transloco }}</th>
      <th>{{ 'admin.energy_systems.fields.active' | transloco }}</th>
      <th>{{ 'admin.energy_systems.fields.actions' | transloco }}</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-es>
    <tr>
      <td>{{ es.name }}</td>
      <td>
        <app-status-badge
          [kind]="es.is_active ? 'active' : 'inactive'"
          [label]="(es.is_active ? 'common.active' : 'common.inactive') | transloco"
        />
      </td>
      <td class="energy-systems-list__actions">
        <a [routerLink]="[es.id, 'edit']">
          <p-button
            icon="pi pi-pencil"
            [text]="true"
            severity="secondary"
            [ariaLabel]="'admin.energy_systems.fields.actions' | transloco"
          />
        </a>
        @if (es.is_active) {
          <p-button
            icon="pi pi-trash"
            [ariaLabel]="'common.delete' | transloco"
            [text]="true"
            severity="danger"
            (onClick)="confirmDelete(es)"
          />
        } @else {
          <p-button
            icon="pi pi-undo"
            [ariaLabel]="'common.restore' | transloco"
            [text]="true"
            severity="success"
            (onClick)="restore(es)"
          />
        }
      </td>
    </tr>
  </ng-template>
  <ng-template pTemplate="emptymessage">
    <tr>
      @if (error()) {
        <td colspan="3" class="energy-systems-list__empty-cell">
          <div class="energy-systems-list__empty-error">
            <p-message severity="error" [text]="'common.load_failed' | transloco" />
            <p-button
              [label]="'common.retry' | transloco"
              icon="pi pi-refresh"
              severity="secondary"
              [outlined]="true"
              size="small"
              (onClick)="retry()"
            />
          </div>
        </td>
      } @else {
        <td colspan="3" class="energy-systems-list__empty-cell" style="color: var(--p-text-muted-color)">—</td>
      }
    </tr>
  </ng-template>
</p-table>

<p-confirmDialog />
