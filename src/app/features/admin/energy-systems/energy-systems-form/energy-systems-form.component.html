<div class="page page--narrow">
  <app-page-header [title]="(esId() ? 'admin.energy_systems.form.edit_title' : 'admin.energy_systems.form.new_title') | transloco">
    <p-button
      slot="left"
      type="button"
      severity="secondary"
      [outlined]="true"
      icon="pi pi-arrow-left"
      [label]="'common.back' | transloco"
      [routerLink]="['/admin/energy-systems']"
    />
    @if (esId()) {
      <app-status-badge
        slot="title-after"
        [kind]="activeValue() ? 'active' : 'inactive'"
        [label]="(activeValue() ? 'common.active' : 'common.inactive') | transloco"
      />
    }
    @if (esId()) {
      <app-active-toggle
        slot="right"
        [entityId]="esId()!"
        [value]="activeValue()"
        [patch]="patchActive"
        [labels]="activeLabels()"
        (valueChange)="activeValue.set($event)"
      />
    }
  </app-page-header>

  <div class="card form-card">
    <form [formGroup]="form">
      <div class="meta-grid">
        <app-meta-field [full]="true" [label]="'admin.energy_systems.fields.name' | transloco">
          <p-tabs value="fr" class="builder-tabs">
            <p-tablist>
              <p-tab value="fr">FR</p-tab>
              <p-tab value="nl">NL</p-tab>
              <p-tab value="en">EN</p-tab>
              <p-tab value="it">IT</p-tab>
              <p-tab value="es">ES</p-tab>
            </p-tablist>
            <p-tabpanels>
              <p-tabpanel value="fr"><input pInputText formControlName="name_fr" placeholder="Français" class="w-full" /></p-tabpanel>
              <p-tabpanel value="nl"><input pInputText formControlName="name_nl" placeholder="Nederlands" class="w-full" /></p-tabpanel>
              <p-tabpanel value="en"><input pInputText formControlName="name_en" placeholder="English" class="w-full" /></p-tabpanel>
              <p-tabpanel value="it"><input pInputText formControlName="name_it" placeholder="Italiano" class="w-full" /></p-tabpanel>
              <p-tabpanel value="es"><input pInputText formControlName="name_es" placeholder="Español" class="w-full" /></p-tabpanel>
            </p-tabpanels>
          </p-tabs>
        </app-meta-field>
      </div>
      @if (form.errors?.['nameRequired'] && form.dirty) {
        <small class="text-xs text-red-700">{{ 'admin.common.name_required' | transloco }}</small>
      }
    </form>

    <app-form-footer
      [saving]="saving()"
      [disabled]="form.invalid"
      [cancelLabel]="'common.cancel' | transloco"
      [saveLabel]="'common.save' | transloco"
      (cancel)="cancel()"
      (save)="submit()"
    />
  </div>

  <p-confirmDialog />
</div>
