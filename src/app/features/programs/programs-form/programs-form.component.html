<div class="page page--narrow">
  <app-page-header
    [title]="(isEditMode() ? 'programs.form.edit_title' : 'programs.form.new_title') | transloco"
  >
    <p-button
      slot="left"
      type="button"
      severity="secondary"
      [outlined]="true"
      icon="pi pi-arrow-left"
      [label]="'common.back' | transloco"
      [routerLink]="programId() ? ['/programs', programId()] : ['/programs']"
    />
    @if (isEditMode()) {
      <app-status-badge
        slot="title-after"
        [kind]="activeValue() ? 'active' : 'inactive'"
        [label]="(activeValue() ? 'common.active' : 'common.inactive') | transloco"
      />
    }
    @if (isEditMode()) {
      <app-active-toggle
        slot="right"
        [entityId]="programId()!"
        [value]="activeValue()"
        [patch]="patchActive"
        [labels]="activeLabels()"
        (valueChange)="activeValue.set($event)"
      />
      <!-- Wrap in a span so the tooltip still fires when the button is disabled
           (PrimeNG disabled buttons don't emit hover events). -->
      <span
        slot="right"
        [pTooltip]="hasLinkedEvents() ? ('programs.form.delete_blocked' | transloco) : ''"
        tooltipPosition="bottom"
      >
        <p-button
          type="button"
          severity="danger"
          [outlined]="true"
          icon="pi pi-trash"
          [label]="'programs.form.delete' | transloco"
          [disabled]="hasLinkedEvents()"
          [ariaLabel]="
            (hasLinkedEvents() ? 'programs.form.delete_blocked' : 'programs.form.delete')
              | transloco
          "
          (onClick)="confirmDelete()"
        />
      </span>
    }
  </app-page-header>

  @if (loading()) {
    <div class="card">
      <p class="meta-hint">{{ 'common.loading' | transloco }}…</p>
    </div>
  } @else if (notFound()) {
    <div class="card"><p class="meta-hint">{{ 'programs.detail.not_found' | transloco }}</p></div>
  } @else if (loadError()) {
    <div class="card flex flex-col items-start gap-3">
      <p-message severity="error" [text]="'common.load_failed' | transloco" />
      <p-button
        icon="pi pi-refresh"
        [label]="'common.retry' | transloco"
        severity="secondary"
        [outlined]="true"
        (onClick)="reloadProgram()"
      />
    </div>
  } @else {
    <div class="card form-card builder-stack">
      <form [formGroup]="form">
        <!-- Row 1 — Team (full width). Edit: disabled (team is not changeable). -->
        <div class="meta-grid">
          <app-meta-field
            #teamField
            [full]="true"
            [label]="'programs.form.team' | transloco"
            for="team_id"
            [tooltip]="isEditMode() ? ('programs.form.team_locked_help' | transloco) : null"
            [error]="
              !isEditMode() && availableTeams().length === 0
                ? ('programs.form.no_manager_team' | transloco)
                : fieldError('team_id')
            "
          >
            <p-select
              inputId="team_id"
              [options]="availableTeams()"
              formControlName="team_id"
              optionLabel="name"
              optionValue="id"
              [filter]="true"
              [placeholder]="'programs.form.team_placeholder' | transloco"
              [appAriaDescribes]="
                (!isEditMode() && availableTeams().length === 0) || fieldError('team_id')
                  ? teamField.errorId()
                  : null
              "
            />
          </app-meta-field>
        </div>

        <!-- Row 2 — Name + start date + end date. -->
        <div class="meta-grid cols-3">
          <app-meta-field
            #nameField
            [label]="'programs.form.name' | transloco"
            for="name"
            [error]="fieldError('name')"
          >
            <input
              pInputText
              id="name"
              formControlName="name"
              [placeholder]="'programs.form.name_placeholder' | transloco"
              [attr.aria-describedby]="fieldError('name') ? nameField.errorId() : null"
            />
          </app-meta-field>
          <app-meta-field
            #dateStartField
            [label]="'programs.form.date_start' | transloco"
            for="date_start"
            [error]="fieldError('date_start')"
          >
            <p-datepicker
              inputId="date_start"
              formControlName="date_start"
              dateFormat="dd/mm/yy"
              [showIcon]="true"
              appendTo="body"
              [appAriaDescribes]="fieldError('date_start') ? dateStartField.errorId() : null"
            />
          </app-meta-field>
          <app-meta-field
            #dateEndField
            [label]="'programs.form.date_end' | transloco"
            for="date_end"
            [error]="fieldError('date_end')"
          >
            <p-datepicker
              inputId="date_end"
              formControlName="date_end"
              dateFormat="dd/mm/yy"
              [showIcon]="true"
              appendTo="body"
              [appAriaDescribes]="fieldError('date_end') ? dateEndField.errorId() : null"
            />
          </app-meta-field>
        </div>

        <!-- Frequency (kept; not part of the 3 spec rows). -->
        <div class="meta-grid cols-2">
          <app-meta-field
            #frequencyField
            [label]="'programs.form.frequency' | transloco"
            for="frequency_per_week"
            [tooltip]="'programs.form.frequency_help' | transloco"
            [error]="fieldError('frequency_per_week')"
          >
            <p-inputnumber
              inputId="frequency_per_week"
              formControlName="frequency_per_week"
              [min]="0"
              [max]="14"
              [showButtons]="true"
              buttonLayout="horizontal"
              spinnerMode="horizontal"
              [ariaDescribedBy]="fieldError('frequency_per_week') ? frequencyField.errorId() : undefined"
              decrementButtonIcon="pi pi-minus"
              incrementButtonIcon="pi pi-plus"
            />
          </app-meta-field>
        </div>

        <!-- Row 3 — Description (rich editor, ~3 lines). -->
        <div class="meta-grid">
          <app-meta-field
            #descriptionField
            [full]="true"
            [label]="'programs.form.description' | transloco"
            [error]="fieldError('description')"
          >
            <app-rich-editor formControlName="description" [style]="{ height: '7rem' }"
              [appAriaDescribes]="fieldError('description') ? descriptionField.errorId() : null" />
          </app-meta-field>
        </div>
      </form>

      <app-form-footer
        [saving]="saving()"
        [cancelLabel]="'common.cancel' | transloco"
        [saveLabel]="'common.save' | transloco"
        (cancel)="cancel()"
        (save)="submit()"
      />
    </div>
  }

  <p-confirmDialog />
</div>
