<p-dialog
  [visible]="visible()"
  (visibleChange)="onVisibleChange($event)"
  [modal]="true"
  [closable]="!saving()"
  [style]="{ width: '32rem' }"
  [header]="(mode() === 'create' ? 'events.exercise_form.title_create' : 'events.exercise_form.title_edit') | transloco"
>
  <form [formGroup]="form">
    <div class="meta-grid">
      <app-meta-field
        [full]="true"
        [label]="'events.exercise_form.fields.modality' | transloco"
        for="ex_modality"
        [hint]="
          modalities().length === 0 && !loadingOptions()
            ? ('events.exercise_form.errors.no_modalities' | transloco)
            : null
        "
        [error]="fieldError('modality_id')"
      >
        <p-select
          inputId="ex_modality"
          formControlName="modality_id"
          [options]="modalities()"
          optionLabel="name"
          optionValue="id"
          [placeholder]="'events.exercise_form.fields.modality_placeholder' | transloco"
          appendTo="body"
        />
      </app-meta-field>

      <app-meta-field
        [full]="true"
        [label]="'events.exercise_form.fields.energysegment' | transloco"
        for="ex_segment"
        [hint]="
          energySegments().length === 0 && !loadingOptions()
            ? ('events.exercise_form.errors.no_segments' | transloco)
            : null
        "
        [error]="fieldError('energysegment_id')"
      >
        <p-select
          inputId="ex_segment"
          formControlName="energysegment_id"
          [options]="energySegments()"
          optionLabel="abv"
          optionValue="id"
          [placeholder]="'events.exercise_form.fields.energysegment_placeholder' | transloco"
          appendTo="body"
        />
      </app-meta-field>

      <app-meta-field
        [label]="'events.exercise_form.fields.repetition' | transloco"
        for="ex_repetition"
        [error]="fieldError('repetition')"
      >
        <p-inputNumber
          inputId="ex_repetition"
          formControlName="repetition"
          [min]="1"
          [showButtons]="true"
          buttonLayout="horizontal"
          spinnerMode="horizontal"
          [useGrouping]="false"
          decrementButtonIcon="pi pi-minus"
          incrementButtonIcon="pi pi-plus"
        />
      </app-meta-field>

      <app-meta-field
        [label]="'events.exercise_form.fields.distance' | transloco"
        for="ex_distance"
        [error]="fieldError('distance')"
      >
        <p-inputNumber
          inputId="ex_distance"
          formControlName="distance"
          [min]="0"
          [step]="25"
          [showButtons]="true"
          buttonLayout="horizontal"
          spinnerMode="horizontal"
          [useGrouping]="false"
          suffix=" m"
          decrementButtonIcon="pi pi-minus"
          incrementButtonIcon="pi pi-plus"
        />
      </app-meta-field>

      <app-meta-field
        [label]="'events.exercise_form.fields.t_start' | transloco"
        for="ex_t_start"
        [error]="
          form.controls.t_start.invalid && form.controls.t_start.dirty
            ? ('events.shared.time_mmss_invalid' | transloco)
            : fieldError('t_start')
        "
      >
        <input
          pInputText
          id="ex_t_start"
          formControlName="t_start"
          inputmode="numeric"
          pattern="\d{1,3}:[0-5]\d"
          maxlength="6"
          [placeholder]="'events.exercise_form.fields.time_placeholder' | transloco"
        />
      </app-meta-field>

      <app-meta-field
        [label]="'events.exercise_form.fields.t_break' | transloco"
        for="ex_t_break"
        [error]="
          form.controls.t_break.invalid && form.controls.t_break.dirty
            ? ('events.shared.time_mmss_invalid' | transloco)
            : fieldError('t_break')
        "
      >
        <input
          pInputText
          id="ex_t_break"
          formControlName="t_break"
          inputmode="numeric"
          pattern="\d{1,3}:[0-5]\d"
          maxlength="6"
          [placeholder]="'events.exercise_form.fields.time_placeholder' | transloco"
        />
      </app-meta-field>

      <app-meta-field
        [full]="true"
        [label]="'events.exercise_form.fields.notes' | transloco"
        for="ex_notes"
        [error]="fieldError('notes')"
      >
        <textarea
          pTextarea
          id="ex_notes"
          formControlName="notes"
          rows="2"
          [autoResize]="true"
        ></textarea>
      </app-meta-field>
    </div>
  </form>
  <app-form-footer
    [saving]="saving()"
    [disabled]="form.invalid || !hasOptions()"
    [cancelLabel]="'events.exercise_form.cancel' | transloco"
    [saveLabel]="'events.exercise_form.save' | transloco"
    (cancel)="onCancel()"
    (save)="submit()"
  />
</p-dialog>
