<p-dialog
  [visible]="visible()"
  (visibleChange)="onVisibleChange($event)"
  [modal]="true"
  [closable]="!loading()"
  [style]="{ width: '30rem' }"
  [header]="'events.duplicate.title' | transloco"
>
  <form [formGroup]="form" class="flex flex-col gap-4">
    <div class="flex flex-col gap-2">
      <label for="duplicate_date" class="text-sm font-medium text-gray-700">
        {{ 'events.duplicate.date' | transloco }}
      </label>
      <p-datepicker
        inputId="duplicate_date"
        formControlName="date"
        dateFormat="dd/mm/yy"
        [showIcon]="true"
        appendTo="body"
        [disabled]="loading()"
      />
    </div>

    <label class="flex items-center justify-between gap-3">
      <span class="text-sm font-medium text-gray-700">
        {{ 'events.duplicate.repeat_weekly' | transloco }}
      </span>
      <p-toggleswitch formControlName="repeat_weekly" [disabled]="loading()" />
    </label>

    @if (repeatWeekly()) {
      <div class="flex flex-col gap-2">
        <label for="duplicate_occurrences" class="text-sm font-medium text-gray-700">
          {{ 'events.duplicate.occurrences' | transloco }}
        </label>
        <p-inputNumber
          inputId="duplicate_occurrences"
          formControlName="occurrences"
          [min]="2"
          [max]="52"
          [showButtons]="true"
          [useGrouping]="false"
          [disabled]="loading()"
        />
      </div>
    }
  </form>

  <ng-template #footer>
    <p-button
      type="button"
      severity="secondary"
      [text]="true"
      [label]="'common.cancel' | transloco"
      [disabled]="loading()"
      (onClick)="onVisibleChange(false)"
    />
    <p-button
      type="button"
      icon="pi pi-copy"
      [label]="'events.duplicate.submit' | transloco"
      [loading]="loading()"
      [disabled]="!canSubmit()"
      (onClick)="onConfirm()"
    />
  </ng-template>
</p-dialog>
