@if (draft() || canManage()) {
  <div class="athlete-brief">
    <div class="athlete-brief__head">
      <h4 class="athlete-brief__title">
        <i class="pi pi-sparkles" aria-hidden="true"></i>
        {{ 'events.athlete_brief.title' | transloco }}
      </h4>
      @if (canManage()) {
        <p-button
          [label]="
            (draft() ? 'events.athlete_brief.regenerate' : 'events.athlete_brief.generate')
              | transloco
          "
          icon="pi pi-sparkles"
          severity="help"
          size="small"
          [text]="true"
          [loading]="generating()"
          (onClick)="generate()"
        />
      }
    </div>

    @if (canManage()) {
      <!-- Editable: the AI seeds the brief, the coach can tweak + save it. -->
      <textarea
        pTextarea
        id="athlete-brief"
        rows="4"
        [ngModel]="draft()"
        (ngModelChange)="draft.set($event)"
        [placeholder]="'events.athlete_brief.placeholder' | transloco"
        class="athlete-brief__textarea"
      ></textarea>
      <div class="athlete-brief__actions">
        <p-button
          [label]="'common.save' | transloco"
          icon="pi pi-check"
          size="small"
          [loading]="saving()"
          (onClick)="save()"
        />
      </div>
    } @else {
      <!-- Athlete: read-only. -->
      <p class="athlete-brief__text">{{ brief() }}</p>
    }
  </div>
}
