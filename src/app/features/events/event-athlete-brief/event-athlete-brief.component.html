@if (draft() || canManage()) {
  <div class="rounded-lg border border-indigo-100 bg-indigo-50/50 p-4 mb-4">
    <div class="flex items-center justify-between gap-3 mb-1 flex-wrap">
      <h4 class="text-sm font-semibold text-indigo-800 flex items-center gap-2">
        <i class="pi pi-sparkles" aria-hidden="true"></i>
        {{ 'events.athlete_brief.title' | transloco }}
      </h4>
      @if (canManage()) {
        <p-button
          [label]="
            (draft() ? 'events.athlete_brief.regenerate' : 'events.athlete_brief.generate')
              | transloco
          "
          icon="pi pi-sparkles"
          severity="help"
          size="small"
          [text]="true"
          [loading]="generating()"
          (onClick)="generate()"
        />
      }
    </div>

    @if (canManage()) {
      <!-- Editable: the AI seeds the brief, the coach can tweak + save it. -->
      <textarea
        pTextarea
        id="athlete-brief"
        rows="4"
        [ngModel]="draft()"
        (ngModelChange)="draft.set($event)"
        [placeholder]="'events.athlete_brief.placeholder' | transloco"
        class="w-full mt-1"
      ></textarea>
      <div class="mt-2">
        <p-button
          [label]="'common.save' | transloco"
          icon="pi pi-check"
          size="small"
          [loading]="saving()"
          (onClick)="save()"
        />
      </div>
    } @else {
      <!-- Athlete: read-only. -->
      <p class="text-sm text-gray-700 leading-relaxed whitespace-pre-line">{{ brief() }}</p>
    }
  </div>
}
