<p-dialog
  [visible]="visible()"
  (visibleChange)="onVisibleChange($event)"
  [modal]="true"
  [closable]="!saving()"
  [style]="{ width: '28rem' }"
  [header]="(mode() === 'create' ? 'events.round_form.title_create' : 'events.round_form.title_edit') | transloco"
>
  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
    <div class="flex flex-col gap-2">
      <label for="round_count" class="text-sm font-medium text-gray-700">
        {{ 'events.round_form.fields.count' | transloco }}
      </label>
      <p-inputNumber
        inputId="round_count"
        formControlName="count"
        [min]="1"
        [showButtons]="true"
        [useGrouping]="false"
      />
      <p-message
        severity="info"
        size="small"
        [text]="'events.round_form.fields.count_help' | transloco"
        styleClass="text-xs"
      />
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div class="flex flex-col gap-2">
        <label for="round_t_start" class="text-sm font-medium text-gray-700">
          {{ 'events.round_form.fields.t_start' | transloco }}
        </label>
        <input
          pInputText
          id="round_t_start"
          formControlName="t_start"
          [placeholder]="'events.round_form.fields.time_placeholder' | transloco"
        />
      </div>
      <div class="flex flex-col gap-2">
        <label for="round_t_break" class="text-sm font-medium text-gray-700">
          {{ 'events.round_form.fields.t_break' | transloco }}
        </label>
        <input
          pInputText
          id="round_t_break"
          formControlName="t_break"
          [placeholder]="'events.round_form.fields.time_placeholder' | transloco"
        />
      </div>
    </div>

    @if (errorMessage(); as msg) {
      <p-message severity="error" [text]="msg | transloco" />
    }

    @if (fieldErrors(); as errors) {
      <div class="flex flex-col gap-1">
        @for (entry of errors | keyvalue; track entry.key) {
          <p-message severity="warn" [text]="entry.key + ': ' + entry.value.join(', ')" />
        }
      </div>
    }

    <div class="flex justify-end gap-2 pt-2">
      <p-button
        type="button"
        severity="secondary"
        [text]="true"
        [label]="'events.round_form.cancel' | transloco"
        [disabled]="saving()"
        (onClick)="onCancel()"
      />
      <p-button
        type="submit"
        [label]="'events.round_form.save' | transloco"
        [loading]="saving()"
        [disabled]="form.invalid"
      />
    </div>
  </form>
</p-dialog>
