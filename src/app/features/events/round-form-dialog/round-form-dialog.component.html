<p-dialog
  [visible]="visible()"
  (visibleChange)="onVisibleChange($event)"
  [modal]="true"
  [closable]="!saving()"
  [style]="{ width: '28rem' }"
  [header]="(mode() === 'create' ? 'events.round_form.title_create' : 'events.round_form.title_edit') | transloco"
>
  <form [formGroup]="form">
    <div class="meta-grid">
      <app-meta-field
        [full]="true"
        [label]="'events.round_form.fields.count' | transloco"
        for="round_count"
        [hint]="'events.round_form.fields.count_help' | transloco"
        [error]="fieldError('count')"
      >
        <p-inputNumber
          inputId="round_count"
          formControlName="count"
          [min]="1"
          [showButtons]="true"
          buttonLayout="horizontal"
          spinnerMode="horizontal"
          [useGrouping]="false"
          decrementButtonIcon="pi pi-minus"
          incrementButtonIcon="pi pi-plus"
        />
      </app-meta-field>
      <app-meta-field
        [label]="'events.round_form.fields.t_start' | transloco"
        for="round_t_start"
        [error]="
          form.controls.t_start.invalid && form.controls.t_start.dirty
            ? ('events.shared.time_mmss_invalid' | transloco)
            : fieldError('t_start')
        "
      >
        <input
          pInputText
          id="round_t_start"
          formControlName="t_start"
          inputmode="numeric"
          pattern="\d{1,3}:[0-5]\d"
          maxlength="6"
          [placeholder]="'events.round_form.fields.time_placeholder' | transloco"
        />
      </app-meta-field>
      <app-meta-field
        [label]="'events.round_form.fields.t_break' | transloco"
        for="round_t_break"
        [error]="
          form.controls.t_break.invalid && form.controls.t_break.dirty
            ? ('events.shared.time_mmss_invalid' | transloco)
            : fieldError('t_break')
        "
      >
        <input
          pInputText
          id="round_t_break"
          formControlName="t_break"
          inputmode="numeric"
          pattern="\d{1,3}:[0-5]\d"
          maxlength="6"
          [placeholder]="'events.round_form.fields.time_placeholder' | transloco"
        />
      </app-meta-field>
    </div>
  </form>
  <app-form-footer
    [saving]="saving()"
    [disabled]="form.invalid"
    [cancelLabel]="'events.round_form.cancel' | transloco"
    [saveLabel]="'events.round_form.save' | transloco"
    (cancel)="onCancel()"
    (save)="submit()"
  />
</p-dialog>
