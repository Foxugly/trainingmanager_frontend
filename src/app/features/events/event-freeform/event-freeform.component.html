<h3 class="text-sm font-semibold mb-2">{{ 'events.training.freeform_heading' | transloco }}</h3>
@if (canManage()) {
  <app-rich-editor [style]="{ height: '12rem' }" [ngModel]="content()" (ngModelChange)="draft.set($event)" />
  <div class="mt-2">
    <p-button [label]="'common.save' | transloco" [loading]="saving()" (onClick)="save()" />
  </div>
} @else {
  <div class="prose max-w-none" [innerHTML]="content()"></div>
}
