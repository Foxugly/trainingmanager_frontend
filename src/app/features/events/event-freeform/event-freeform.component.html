<h3 class="freeform__heading">{{ 'events.training.freeform_heading' | transloco }}</h3>
@if (canManage()) {
  <app-rich-editor [style]="{ height: '12rem' }" [ngModel]="content()" (ngModelChange)="draft.set($event)" />
  <div class="freeform__actions">
    <p-button [label]="'common.save' | transloco" [loading]="saving()" [disabled]="saving()" (onClick)="save()" />
  </div>
} @else {
  <div class="rich-text" [innerHTML]="content()"></div>
}
