<div class="page page--narrow">
  <app-page-header [title]="'profile.change_password' | transloco">
    <p-button slot="left" type="button" severity="secondary" [outlined]="true"
      icon="pi pi-arrow-left" [label]="'common.back' | transloco" [routerLink]="['/profile']" />
  </app-page-header>

  <div class="card form-card">
    <form [formGroup]="form">
      <div class="meta-grid">
        <app-meta-field #currentPwField [full]="true" [label]="'profile.confirm_password' | transloco"
          for="current_password" [error]="fieldError('current_password')">
          <p-password inputId="current_password" formControlName="current_password"
            [feedback]="false" [toggleMask]="true" autocomplete="current-password" [fluid]="true"
            [appAriaDescribes]="fieldError('current_password') ? currentPwField.errorId() : null" />
        </app-meta-field>
        <app-meta-field #newPwField [full]="true" [label]="'profile.new_password' | transloco"
          for="new_password" [error]="fieldError('new_password')">
          <p-password inputId="new_password" formControlName="new_password"
            [feedback]="false" [toggleMask]="true" autocomplete="new-password" [fluid]="true"
            [appAriaDescribes]="fieldError('new_password') ? newPwField.errorId() : null" />
        </app-meta-field>
        <app-meta-field #newPwConfirmField [full]="true" [label]="'profile.new_password_confirm' | transloco"
          for="new_password_confirm" [error]="fieldError('new_password_confirm')">
          <p-password inputId="new_password_confirm" formControlName="new_password_confirm"
            [feedback]="false" [toggleMask]="true" autocomplete="new-password" [fluid]="true"
            [appAriaDescribes]="fieldError('new_password_confirm') ? newPwConfirmField.errorId() : null" />
        </app-meta-field>
      </div>
    </form>

    <app-form-footer
      [saving]="loading()"
      [disabled]="form.invalid"
      [cancelLabel]="'common.cancel' | transloco"
      [saveLabel]="'common.save' | transloco"
      (cancel)="cancel()"
      (save)="submit()"
    />
  </div>
</div>
