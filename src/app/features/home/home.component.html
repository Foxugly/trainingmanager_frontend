<section id="hero" class="home-hero">
  <div class="home-hero__bg" aria-hidden="true"></div>
  <div class="home-hero__blob home-hero__blob--top" aria-hidden="true"></div>
  <div class="home-hero__blob home-hero__blob--bottom" aria-hidden="true"></div>

  <div class="home-hero__container">
    <div class="home-hero__inner">
      <span class="home-hero__badge">
        <i class="pi pi-sparkles" aria-hidden="true"></i>
        {{ 'home.hero.tagline' | transloco }}
      </span>
      <h1 class="home-hero__title">
        {{ 'home.hero.title' | transloco }}
      </h1>
      <p class="home-hero__subtitle">
        {{ 'home.hero.subtitle' | transloco }}
      </p>
      <div class="home-hero__actions">
        <a [routerLink]="['/login']" class="home-hero__cta home-hero__cta--primary">
          {{ 'home.hero.cta_primary' | transloco }}
          <i class="pi pi-arrow-right" aria-hidden="true"></i>
        </a>
        <a [routerLink]="['/features']" class="home-hero__cta home-hero__cta--secondary">
          {{ 'home.hero.cta_secondary' | transloco }}
          <i class="pi pi-arrow-right" aria-hidden="true"></i>
        </a>
      </div>
    </div>
  </div>
</section>
