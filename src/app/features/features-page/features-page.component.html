<section class="py-12 md:py-20">
  <div class="container mx-auto px-6">
    <div class="mx-auto max-w-2xl text-center">
      <h1 class="text-3xl font-bold tracking-tight text-gray-900 md:text-4xl">
        {{ 'features_page.title' | transloco }}
      </h1>
      <p class="mt-4 text-base text-gray-600 md:text-lg">
        {{ 'features_page.subtitle' | transloco }}
      </p>
    </div>

    <div class="mt-10 grid gap-6 md:grid-cols-2 lg:grid-cols-3">
      @for (s of sections; track s.key) {
        <article
          class="group relative flex flex-col rounded-2xl border border-gray-200 bg-white p-7 shadow-sm transition hover:-translate-y-1 hover:border-emerald-200 hover:shadow-lg"
        >
          <div
            class="mb-5 inline-flex h-12 w-12 items-center justify-center rounded-xl"
            [class]="toneClasses[s.tone]"
            aria-hidden="true"
          >
            <i class="pi text-xl" [class]="s.icon"></i>
          </div>
          <h2 class="text-lg font-semibold text-gray-900">
            {{ 'features_page.sections.' + s.key + '.title' | transloco }}
          </h2>
          <p class="mt-3 text-sm leading-relaxed text-gray-600">
            {{ 'features_page.sections.' + s.key + '.description' | transloco }}
          </p>
        </article>
      }
    </div>

    <div class="mt-12 text-center">
      <a
        [routerLink]="['/login']"
        class="inline-flex items-center justify-center gap-2 rounded-lg bg-gradient-to-r from-emerald-600 to-teal-600 px-7 py-3 text-base font-semibold text-white shadow-lg shadow-emerald-500/20 transition hover:from-emerald-500 hover:to-teal-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500 focus-visible:ring-offset-2"
      >
        {{ 'features_page.cta' | transloco }}
        <i class="pi pi-arrow-right text-sm" aria-hidden="true"></i>
      </a>
    </div>
  </div>
</section>
