<section class="features-page">
  <div class="features-page__container">
    <div class="features-page__intro">
      <h1 class="features-page__title">
        {{ 'features_page.title' | transloco }}
      </h1>
      <p class="features-page__subtitle">
        {{ 'features_page.subtitle' | transloco }}
      </p>
    </div>

    <div class="features-page__grid">
      @for (s of sections; track s.key) {
        <article class="features-page__card">
          <div class="features-page__icon" [class]="toneClasses[s.tone]" aria-hidden="true">
            <i class="pi" [class]="s.icon"></i>
          </div>
          <h2 class="features-page__card-title">
            {{ 'features_page.sections.' + s.key + '.title' | transloco }}
          </h2>
          <p class="features-page__card-desc">
            {{ 'features_page.sections.' + s.key + '.description' | transloco }}
          </p>
        </article>
      }
    </div>

    <div class="features-page__cta-wrap">
      <a [routerLink]="['/login']" class="features-page__cta">
        {{ 'features_page.cta' | transloco }}
        <i class="pi pi-arrow-right" aria-hidden="true"></i>
      </a>
    </div>
  </div>
</section>
