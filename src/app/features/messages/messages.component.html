<div class="page page--narrow">
  <header class="messages__header">
    <h1 class="messages__title">{{ 'messages.title' | transloco }}</h1>
    <p class="messages__subtitle">{{ 'messages.subtitle' | transloco }}</p>
  </header>

  @if (loading()) {
    <ul class="messages__list" aria-hidden="true">
      @for (_ of [1, 2, 3]; track $index) {
        <li class="messages__skeleton">
          <p-skeleton width="50%" height="1rem" styleClass="messages__skeleton-line" />
          <p-skeleton width="30%" height="0.75rem" />
        </li>
      }
    </ul>
  } @else if (error()) {
    <app-empty-state
      tone="rose"
      icon="exclamation-triangle"
      [title]="'common.load_failed' | transloco"
    >
      <p-button
        [label]="'common.retry' | transloco"
        icon="pi pi-refresh"
        severity="secondary"
        [outlined]="true"
        size="small"
        (onClick)="load()"
      />
    </app-empty-state>
  } @else if (rows().length === 0) {
    <app-empty-state
      icon="comments"
      [title]="'messages.empty' | transloco"
      [subtitle]="'messages.empty_subtitle' | transloco"
    >
      <a [routerLink]="['/teams', 'discover']">
        <p-button
          [label]="'teams.list.discover_cta' | transloco"
          icon="pi pi-compass"
          severity="secondary"
          [outlined]="true"
          size="small"
        />
      </a>
    </app-empty-state>
  } @else {
    <ul class="messages__list">
      @for (row of rows(); track row.teamId + '-' + row.topic.id) {
        <li>
          <button type="button" class="messages__topic" (click)="openTopic(row)">
            <div class="messages__topic-body">
              <div class="messages__icon">
                <i class="pi pi-comments" aria-hidden="true"></i>
              </div>
              <div class="messages__topic-main">
                <div class="messages__topic-head">
                  <span class="messages__topic-title">{{ row.topic.title }}</span>
                  <p-tag
                    [value]="
                      (row.topic.audience === AudienceEnum.Coaches
                        ? 'teams.discussions.audience_coaches'
                        : 'teams.discussions.audience_team'
                      ) | transloco
                    "
                    [severity]="row.topic.audience === AudienceEnum.Coaches ? 'warn' : 'info'"
                  />
                </div>
                <p class="messages__team">{{ row.teamName }}</p>
                <div class="messages__topic-meta">
                  <span>
                    <i class="pi pi-comment" aria-hidden="true"></i> {{ row.topic.message_count }}
                  </span>
                  <span>{{ row.topic.updated_at | localizedDate: 'short' }}</span>
                </div>
              </div>
              <i class="pi pi-arrow-right messages__arrow" aria-hidden="true"></i>
            </div>
          </button>
        </li>
      }
    </ul>
  }
</div>
