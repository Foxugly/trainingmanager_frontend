<div class="page page--narrow">
  <header class="mb-2">
    <h1 class="text-2xl font-bold">{{ 'messages.title' | transloco }}</h1>
    <p class="text-sm text-gray-600 mt-1">{{ 'messages.subtitle' | transloco }}</p>
  </header>

  @if (loading()) {
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" aria-hidden="true">
      @for (_ of [1, 2, 3]; track $index) {
        <div class="p-4 bg-white border border-gray-200 rounded-lg">
          <div class="flex items-start gap-3">
            <p-skeleton width="2.75rem" height="2.75rem" borderRadius="0.75rem" />
            <div class="flex-1">
              <p-skeleton width="60%" height="1rem" styleClass="mb-1" />
              <p-skeleton width="40%" height="0.75rem" />
            </div>
          </div>
        </div>
      }
    </div>
  } @else if (teams().length === 0) {
    <app-empty-state
      icon="comments"
      [title]="'messages.empty' | transloco"
      [subtitle]="'messages.subtitle' | transloco"
    >
      <a [routerLink]="['/teams', 'discover']">
        <p-button
          [label]="'teams.list.discover_cta' | transloco"
          icon="pi pi-compass"
          severity="secondary"
          [outlined]="true"
          size="small"
        />
      </a>
    </app-empty-state>
  } @else {
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      @for (team of teams(); track team.id) {
        <a
          [routerLink]="['/teams', team.id]"
          class="group block rounded-xl border border-gray-200 bg-white p-5 transition duration-200 hover:-translate-y-0.5 hover:border-emerald-300 hover:shadow-md"
        >
          <div class="flex items-start gap-3">
            @if (team.logo) {
              <img
                [src]="team.logo"
                [alt]="team.name"
                class="shrink-0 size-11 rounded-xl object-cover border border-gray-200"
              />
            } @else {
              <div
                class="shrink-0 size-11 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center"
              >
                <i class="pi pi-comments text-lg" aria-hidden="true"></i>
              </div>
            }
            <div class="min-w-0 flex-1">
              <h2 class="text-base font-semibold text-gray-900 truncate">{{ team.name }}</h2>
              <p class="text-xs text-gray-500 truncate">{{ team.sport.name }}</p>
            </div>
            <i
              class="pi pi-arrow-right text-xs text-emerald-700 opacity-0 transition group-hover:opacity-100"
              aria-hidden="true"
            ></i>
          </div>
        </a>
      }
    </div>
  }
</div>
