<app-auth-card [icon]="'pi pi-envelope'" [title]="'auth.check_email.title' | transloco">
  @if (email(); as e) {
      <p class="check-email__body">
        {{ 'auth.check_email.body_with_email' | transloco: { email: e } }}
      </p>

      @if (errorMessage(); as msg) {
        <div class="check-email__notice">
          <p-message severity="warn" [text]="msg | transloco" />
        </div>
      }

      <p-button
        type="button"
        [label]="
          cooldownActive()
            ? ('auth.check_email.resend_cooldown' | transloco: { seconds: cooldownSeconds() })
            : ('auth.check_email.resend_button' | transloco)
        "
        icon="pi pi-refresh"
        [loading]="resending()"
        [disabled]="resending() || cooldownActive()"
        (onClick)="resend()"
        styleClass="u-full"
      />
    } @else {
      <p class="check-email__body">
        {{ 'auth.check_email.body_no_email' | transloco }}
      </p>

      <form [formGroup]="emailForm" (ngSubmit)="submitEmailForm()" class="check-email__form">
        <label for="email" class="check-email__label">
          {{ 'auth.register.fields.email' | transloco }}
        </label>
        <input
          pInputText
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
        />
        @if (errorMessage(); as msg) {
          <p-message severity="warn" [text]="msg | transloco" />
        }
        <p-button
          type="submit"
          [label]="
            cooldownActive()
              ? ('auth.check_email.resend_cooldown' | transloco: { seconds: cooldownSeconds() })
              : ('auth.check_email.resend_button' | transloco)
          "
          [loading]="resending()"
          [disabled]="emailForm.invalid || resending() || cooldownActive()"
          styleClass="u-full"
        />
      </form>
    }

  <app-auth-back-link />
</app-auth-card>
