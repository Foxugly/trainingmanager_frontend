@switch (state()) {
  @case ('loading') {
    <app-auth-card
      [icon]="'pi pi-spin pi-spinner'"
      [title]="'auth.magic_link.exchange.loading' | transloco"
    />
  }
  @case ('expired') {
    <app-auth-card
      [icon]="'pi pi-clock'"
      [tone]="'warn'"
      [title]="'auth.magic_link.exchange.expired_title' | transloco"
    >
      <div class="magic__state">
        <p class="magic__state-text">
          {{ 'auth.magic_link.exchange.expired_body' | transloco }}
        </p>
        <a [routerLink]="['/login']">
          <p-button
            [label]="'auth.magic_link.exchange.request_new' | transloco"
            icon="pi pi-envelope"
          />
        </a>
      </div>
    </app-auth-card>
  }
  @case ('invalid') {
    <app-auth-card
      [icon]="'pi pi-times-circle'"
      [tone]="'danger'"
      [title]="'auth.magic_link.exchange.invalid_title' | transloco"
    >
      <div class="magic__state">
        <p class="magic__state-text">
          {{ 'auth.magic_link.exchange.invalid_body' | transloco }}
        </p>
        <a [routerLink]="['/login']">
          <p-button
            [label]="'auth.magic_link.exchange.back_to_login' | transloco"
            icon="pi pi-sign-in"
          />
        </a>
      </div>
    </app-auth-card>
  }
}
