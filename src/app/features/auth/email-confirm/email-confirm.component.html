@switch (phase()) {
  @case ('loading') {
    <app-auth-card
      [icon]="'pi pi-spin pi-spinner'"
      [title]="'auth.email_confirm.loading' | transloco"
    />
  }
  @case ('success') {
    <app-auth-card
      [icon]="'pi pi-check-circle'"
      [title]="'auth.email_confirm.success_title' | transloco"
    >
      <div class="email-confirm__state">
        <p class="email-confirm__text">{{ 'auth.email_confirm.success_redirect' | transloco }}</p>
      </div>
    </app-auth-card>
  }
  @case ('invalid_token') {
    <app-auth-card
      [icon]="'pi pi-times-circle'"
      [tone]="'danger'"
      [title]="'auth.email_confirm.error_invalid_token_title' | transloco"
    >
      <div class="email-confirm__state">
        <p class="email-confirm__text email-confirm__text--spaced">{{ 'auth.email_confirm.error_invalid_token' | transloco }}</p>
        <!-- Links are single-use: a second click lands here although the
             account is confirmed, so signing in is the primary way out. -->
        <div class="email-confirm__actions">
          <a [routerLink]="['/login']" data-testid="email-confirm-sign-in">
            <p-button
              [label]="'auth.email_confirm.sign_in_button' | transloco"
              icon="pi pi-sign-in"
            />
          </a>
          <a [routerLink]="['/check-your-email']">
            <p-button
              [label]="'auth.email_confirm.request_resend_button' | transloco"
              icon="pi pi-refresh"
              severity="secondary"
              [outlined]="true"
            />
          </a>
        </div>
      </div>
      <app-auth-back-link />
    </app-auth-card>
  }
  @case ('unknown_error') {
    <app-auth-card
      [icon]="'pi pi-exclamation-triangle'"
      [tone]="'warn'"
      [title]="'auth.email_confirm.error_unknown_title' | transloco"
    >
      <div class="email-confirm__state">
        <p class="email-confirm__text email-confirm__text--spaced">{{ 'auth.email_confirm.error_unknown' | transloco }}</p>
        <a [routerLink]="['/check-your-email']">
          <p-button
            [label]="'auth.email_confirm.request_resend_button' | transloco"
            icon="pi pi-refresh"
            severity="secondary"
            [outlined]="true"
          />
        </a>
      </div>
      <app-auth-back-link />
    </app-auth-card>
  }
}
