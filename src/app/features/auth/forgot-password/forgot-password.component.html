<section class="relative flex min-h-[60vh] items-center justify-center px-4 py-12 md:py-16">
  <div
    class="pointer-events-none absolute inset-0 -z-10 bg-gradient-to-br from-emerald-50 via-white to-teal-50"
    aria-hidden="true"
  ></div>
  <div class="w-full max-w-md p-8 bg-white rounded-2xl shadow-md border border-gray-200">
    <div class="flex flex-col items-center text-center mb-6">
      <div class="size-14 rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center mb-4">
        <i class="pi pi-key text-2xl" aria-hidden="true"></i>
      </div>
      <h1 class="text-2xl font-bold mb-1">{{ 'auth.forgot_password.title' | transloco }}</h1>
      <p class="text-sm text-gray-600">{{ 'auth.forgot_password.subtitle' | transloco }}</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
      <div class="flex flex-col gap-2">
        <label for="email" class="text-sm font-medium text-gray-700">
          {{ 'auth.forgot_password.fields.email' | transloco }}
        </label>
        <input
          pInputText
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          [placeholder]="'auth.forgot_password.fields.email_placeholder' | transloco"
        />
      </div>

      <div class="flex flex-col items-center gap-2 my-2">
        <div #turnstile></div>
        @if (turnstileFailed()) {
          <p-message severity="warn" [text]="'auth.turnstile_failed' | transloco" />
          <p-button
            type="button"
            severity="secondary"
            [text]="true"
            icon="pi pi-refresh"
            [label]="'common.retry' | transloco"
            (onClick)="retryTurnstile()"
          />
        }
      </div>

      @if (errorMessage(); as msg) {
        <p-message severity="error" [text]="msg | transloco" />
      }
      @if (retryCountdown(); as seconds) {
        <p-message
          severity="warn"
          [text]="'auth.forgot_password.rate_limit_countdown' | transloco: { seconds: seconds }"
        />
      }

      <p-button
        type="submit"
        [label]="loading() ? ('auth.forgot_password.requesting' | transloco) : ('auth.forgot_password.submit' | transloco)"
        [loading]="loading()"
        [disabled]="submitDisabled()"
        styleClass="w-full"
      />

      <p class="text-center text-sm text-gray-600 mt-2">
        <a [routerLink]="['/login']" class="text-emerald-600 hover:underline font-medium">
          {{ 'auth.forgot_password.back_to_login' | transloco }}
        </a>
      </p>
    </form>
  </div>
</section>
