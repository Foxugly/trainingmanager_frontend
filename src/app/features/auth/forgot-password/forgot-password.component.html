<section class="forgot">
  <div class="forgot__bg" aria-hidden="true"></div>
  <div class="forgot__card">
    <div class="forgot__header">
      <div class="forgot__icon">
        <i class="pi pi-key forgot__icon-glyph" aria-hidden="true"></i>
      </div>
      <h1 class="forgot__title">{{ 'auth.forgot_password.title' | transloco }}</h1>
      <p class="forgot__subtitle">{{ 'auth.forgot_password.subtitle' | transloco }}</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="forgot__form">
      <div class="forgot__field">
        <label for="email" class="forgot__label">
          {{ 'auth.forgot_password.fields.email' | transloco }}
        </label>
        <input
          pInputText
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          [placeholder]="'auth.forgot_password.fields.email_placeholder' | transloco"
        />
      </div>

      <div class="forgot__turnstile">
        <div #turnstile></div>
        @if (turnstileFailed()) {
          <p-message severity="warn" [text]="'auth.turnstile_failed' | transloco" />
          <p-button
            type="button"
            severity="secondary"
            [text]="true"
            icon="pi pi-refresh"
            [label]="'common.retry' | transloco"
            (onClick)="retryTurnstile()"
          />
        }
      </div>

      @if (errorMessage(); as msg) {
        <p-message severity="error" [text]="msg | transloco" />
      }
      @if (retryCountdown(); as seconds) {
        <p-message
          severity="warn"
          [text]="'auth.forgot_password.rate_limit_countdown' | transloco: { seconds: seconds }"
        />
      }

      <p-button
        type="submit"
        [label]="loading() ? ('auth.forgot_password.requesting' | transloco) : ('auth.forgot_password.submit' | transloco)"
        [loading]="loading()"
        [disabled]="submitDisabled()"
        styleClass="w-full"
      />

      <p class="forgot__footer">
        <a [routerLink]="['/login']" class="forgot__link">
          {{ 'auth.forgot_password.back_to_login' | transloco }}
        </a>
      </p>
    </form>
  </div>
</section>
