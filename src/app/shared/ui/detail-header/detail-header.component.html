<div
  class="fixed inset-x-0 top-0 z-30 border-b border-gray-200 bg-white/90 backdrop-blur transition-all duration-200"
  [class.opacity-100]="condensed()"
  [class.translate-y-0]="condensed()"
  [class.opacity-0]="!condensed()"
  [class.-translate-y-full]="!condensed()"
  [class.pointer-events-none]="!condensed()"
  aria-hidden="true"
>
  <div class="container mx-auto flex items-center gap-3 px-6 py-2.5">
    @if (icon(); as i) {
      <i [class]="'pi ' + i + ' text-indigo-600'" aria-hidden="true"></i>
    }
    <div class="min-w-0 flex-1">
      @if (eyebrow(); as e) {
        <p class="text-[10px] font-semibold uppercase tracking-[0.18em] text-indigo-700 leading-none mb-0.5">
          {{ e }}
        </p>
      }
      <h2 class="truncate text-sm font-semibold leading-tight text-gray-900">
        {{ title() }}
      </h2>
    </div>
  </div>
</div>

<header class="mb-8">
  <ng-content select="[detailHeaderBanner]" />

  @if (backLink(); as link) {
    <a
      [routerLink]="link"
      [class]="
        centered()
          ? 'inline-flex items-center gap-1.5 text-xs text-gray-500 transition hover:text-gray-900 mb-6'
          : 'inline-flex items-center gap-1.5 text-sm text-gray-500 transition hover:text-gray-900 mb-4'
      "
    >
      <i class="pi pi-arrow-left text-xs" aria-hidden="true"></i>
      {{ backLabelKey() | transloco }}
    </a>
  }

  <div
    [class]="
      centered()
        ? 'flex flex-col items-center text-center gap-4'
        : 'flex items-start justify-between gap-6 flex-wrap'
    "
  >
    <div
      [class]="
        centered()
          ? 'order-2 max-w-3xl w-full'
          : 'order-1 min-w-0 flex-1'
      "
    >
      @if (eyebrow(); as e) {
        <p
          [class]="
            centered()
              ? 'mb-2 inline-flex items-center justify-center gap-1.5 text-xs font-semibold uppercase tracking-[0.18em] text-indigo-700'
              : 'mb-2 inline-flex items-center gap-1.5 text-xs font-semibold uppercase tracking-[0.18em] text-indigo-700'
          "
        >
          @if (icon(); as i) {
            <i [class]="'pi ' + i + ' text-[11px]'" aria-hidden="true"></i>
          }
          {{ e }}
        </p>
      }
      <h1 class="text-3xl sm:text-4xl font-semibold tracking-tight leading-tight text-gray-900">
        {{ title() }}
      </h1>
      <div
        [class]="
          centered()
            ? 'mt-3 flex flex-wrap items-center justify-center gap-2 empty:hidden'
            : 'mt-3 flex flex-wrap items-center gap-2 empty:hidden'
        "
      >
        <ng-content select="[detailHeaderBadges]" />
      </div>
    </div>
    <div
      [class]="
        centered()
          ? 'order-1 self-end flex flex-wrap items-center gap-2 empty:hidden'
          : 'order-2 flex shrink-0 flex-wrap items-center gap-2 empty:hidden'
      "
    >
      <ng-content select="[detailHeaderActions]" />
    </div>
  </div>

  <div
    [class]="
      centered()
        ? 'mt-6 flex flex-wrap items-center justify-center gap-x-8 gap-y-3 empty:hidden'
        : 'mt-6 empty:hidden'
    "
  >
    <ng-content select="[detailHeaderMeta]" />
  </div>

  <hr #sentinel class="mt-6 border-gray-200" />
</header>
