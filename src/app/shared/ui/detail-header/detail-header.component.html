<div
  class="detail-header__bar"
  [class.detail-header__bar--visible]="condensed()"
  aria-hidden="true"
>
  <div class="detail-header__bar-inner">
    @if (icon(); as i) {
      <i [class]="'pi ' + i" class="detail-header__bar-icon" aria-hidden="true"></i>
    }
    <div class="detail-header__bar-text">
      @if (eyebrow(); as e) {
        <p class="detail-header__bar-eyebrow">
          {{ e }}
        </p>
      }
      <h2 class="detail-header__bar-title">
        {{ title() }}
      </h2>
    </div>
  </div>
</div>

<header>
  <ng-content select="[detailHeaderBanner]" />

  <div class="detail-header__row">
    @if (backLink(); as link) {
      <a
        [routerLink]="link"
        class="detail-header__back"
      >
        <i class="pi pi-arrow-left" aria-hidden="true"></i>
        <span class="detail-header__sr-only">{{ backLabelKey() | transloco }}</span>
      </a>
    }

    <div class="detail-header__main">
      <h1 class="detail-header__title">
        @if (icon(); as i) {
          <i [class]="'pi ' + i" class="detail-header__title-icon" aria-hidden="true"></i>
        }
        @if (eyebrow(); as e) {
          <span class="detail-header__title-eyebrow">
            {{ e }}
          </span>
        }
        <span>{{ title() }}</span>
        <ng-content select="[detailHeaderTitleSuffix]" />
      </h1>
      <div class="detail-header__subtitle">
        <ng-content select="[detailHeaderSubtitle]" />
      </div>
      <div class="detail-header__badges">
        <ng-content select="[detailHeaderBadges]" />
      </div>
    </div>

    <div class="detail-header__actions">
      <ng-content select="[detailHeaderActions]" />
    </div>
  </div>

  <div class="detail-header__meta">
    <ng-content select="[detailHeaderMeta]" />
  </div>

  <div #sentinel class="detail-header__sentinel" aria-hidden="true"></div>
</header>
