<div
  class="fixed inset-x-0 top-0 z-30 border-b border-gray-200 bg-white/90 backdrop-blur transition-all duration-200"
  [class.opacity-100]="condensed()"
  [class.translate-y-0]="condensed()"
  [class.opacity-0]="!condensed()"
  [class.-translate-y-full]="!condensed()"
  [class.pointer-events-none]="!condensed()"
  aria-hidden="true"
>
  <div class="container mx-auto flex items-center gap-3 px-6 py-2.5">
    @if (icon(); as i) {
      <i [class]="'pi ' + i + ' text-indigo-600'" aria-hidden="true"></i>
    }
    <div class="min-w-0 flex-1">
      @if (eyebrow(); as e) {
        <p class="text-[10px] font-semibold uppercase tracking-[0.18em] text-indigo-700 leading-none mb-0.5">
          {{ e }}
        </p>
      }
      <h2 class="truncate text-sm font-semibold leading-tight text-gray-900">
        {{ title() }}
      </h2>
    </div>
  </div>
</div>

<header>
  <ng-content select="[detailHeaderBanner]" />

  <div class="flex items-center gap-4 flex-wrap">
    @if (backLink(); as link) {
      <a
        [routerLink]="link"
        class="inline-flex items-center gap-1.5 text-sm text-gray-500 transition hover:text-gray-900 shrink-0"
      >
        <i class="pi pi-arrow-left" aria-hidden="true"></i>
        <span class="sr-only">{{ backLabelKey() | transloco }}</span>
      </a>
    }

    <div class="min-w-0 flex-1 flex flex-col items-center text-center gap-1">
      <h1 class="text-2xl sm:text-3xl font-semibold tracking-tight leading-tight text-gray-900 inline-flex items-baseline gap-2 flex-wrap justify-center">
        @if (icon(); as i) {
          <i [class]="'pi ' + i + ' text-[11px] text-indigo-700'" aria-hidden="true"></i>
        }
        @if (eyebrow(); as e) {
          <span class="text-xs font-semibold uppercase tracking-[0.18em] text-indigo-700">
            {{ e }}
          </span>
        }
        <span>{{ title() }}</span>
        <ng-content select="[detailHeaderTitleSuffix]" />
      </h1>
      <div class="text-sm text-gray-600 max-w-2xl empty:hidden">
        <ng-content select="[detailHeaderSubtitle]" />
      </div>
      <div class="flex flex-wrap items-center justify-center gap-2 empty:hidden">
        <ng-content select="[detailHeaderBadges]" />
      </div>
    </div>

    <div class="shrink-0 flex items-center gap-1 empty:hidden">
      <ng-content select="[detailHeaderActions]" />
    </div>
  </div>

  <div class="mt-4 flex flex-wrap items-center justify-center gap-x-6 gap-y-2 empty:hidden">
    <ng-content select="[detailHeaderMeta]" />
  </div>

  <div #sentinel class="mt-4 h-px" aria-hidden="true"></div>
</header>
