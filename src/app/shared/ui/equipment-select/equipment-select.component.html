<p-multiSelect
  [inputId]="inputId()"
  [options]="items()"
  [ngModel]="value"
  (ngModelChange)="onSelectChange($event)"
  optionLabel="name"
  optionValue="id"
  [filter]="true"
  [showClear]="true"
  [disabled]="disabled"
  [placeholder]="'equipment.select_placeholder' | transloco"
  [emptyMessage]="'equipment.none_for_sport' | transloco"
  display="chip"
  styleClass="u-full"
  appendTo="body"
/>
