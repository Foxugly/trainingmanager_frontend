<div class="flex flex-col items-center justify-center text-center px-4 py-10 sm:py-12">
  <div
    class="size-14 rounded-2xl flex items-center justify-center mb-4"
    [class.bg-indigo-100]="tone() === 'indigo'"
    [class.text-indigo-600]="tone() === 'indigo'"
    [class.bg-emerald-100]="tone() === 'emerald'"
    [class.text-emerald-600]="tone() === 'emerald'"
    [class.bg-rose-100]="tone() === 'rose'"
    [class.text-rose-600]="tone() === 'rose'"
    [class.bg-gray-100]="tone() === 'gray'"
    [class.text-gray-500]="tone() === 'gray'"
  >
    <i [class]="'pi pi-' + icon() + ' text-2xl'" aria-hidden="true"></i>
  </div>
  <h3 class="text-base font-semibold text-gray-900 mb-1">{{ title() }}</h3>
  @if (subtitle()) {
    <p class="text-sm text-gray-600 max-w-md">{{ subtitle() }}</p>
  }
  <div class="mt-5 flex flex-wrap items-center justify-center gap-2 empty:hidden">
    <ng-content />
  </div>
</div>
