<div class="empty-state">
  <div
    class="empty-state__icon"
    [class.empty-state__icon--indigo]="tone() === 'indigo'"
    [class.empty-state__icon--emerald]="tone() === 'emerald'"
    [class.empty-state__icon--rose]="tone() === 'rose'"
    [class.empty-state__icon--gray]="tone() === 'gray'"
  >
    <i [class]="'pi pi-' + icon()" class="empty-state__icon-glyph" aria-hidden="true"></i>
  </div>
  <h3 class="empty-state__title">{{ title() }}</h3>
  @if (subtitle()) {
    <p class="empty-state__subtitle">{{ subtitle() }}</p>
  }
  <div class="empty-state__actions">
    <ng-content />
  </div>
</div>
