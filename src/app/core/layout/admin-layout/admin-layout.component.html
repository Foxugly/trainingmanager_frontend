<div class="admin-shell">
  <aside class="admin-shell__sidebar">
    <h2 class="admin-shell__title">{{ 'admin.title' | transloco }}</h2>
    <nav class="admin-shell__nav">
      <a
        [routerLink]="['/admin/sports']"
        routerLinkActive="admin-shell__link--active"
        class="admin-shell__link"
      >
        {{ 'admin.nav.sports' | transloco }}
      </a>
      <a
        [routerLink]="['/admin/energy-systems']"
        routerLinkActive="admin-shell__link--active"
        class="admin-shell__link"
      >
        {{ 'admin.nav.energy_systems' | transloco }}
      </a>
      <a
        [routerLink]="['/admin/energy-segments']"
        routerLinkActive="admin-shell__link--active"
        class="admin-shell__link"
      >
        {{ 'admin.nav.energy_segments' | transloco }}
      </a>
      <a
        [routerLink]="['/admin/modalities']"
        routerLinkActive="admin-shell__link--active"
        class="admin-shell__link"
      >
        {{ 'admin.nav.modalities' | transloco }}
      </a>
      <a
        [routerLink]="['/admin/users']"
        routerLinkActive="admin-shell__link--active"
        class="admin-shell__link"
      >
        {{ 'admin.nav.users' | transloco }}
      </a>
    </nav>
  </aside>
  <!-- Not a <main>: this shell nests inside MainLayout's <main>; a second one
       would be an invalid duplicate landmark. A labelled <section> instead. -->
  <section class="admin-shell__content" [attr.aria-label]="'admin.title' | transloco">
    <router-outlet />
  </section>
</div>
