<footer class="footer">
  <div class="footer-inner">
    <span class="footer-brand">{{ 'app.title' | transloco }}</span>
    <span class="footer-sep">·</span>
    <span class="footer-tagline">{{ 'app.tagline' | transloco }}</span>
    <span class="footer-fill"></span>
    <span class="footer-meta">{{ 'footer.version_label' | transloco }}&nbsp;{{ version }}</span>
    <span class="footer-sep">·</span>
    <span class="footer-meta footer-copyright">
      © {{ year }}
      <a href="https://www.foxugly.com" target="_blank" rel="noopener noreferrer" class="footer-author-link">
        <img src="/foxugly-logo.svg" alt="" class="footer-author-logo" aria-hidden="true" />
        {{ 'footer.author' | transloco }}</a>{{ 'footer.rights' | transloco }}
    </span>
  </div>
</footer>
