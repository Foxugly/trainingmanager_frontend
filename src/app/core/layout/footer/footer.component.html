<footer class="footer">
  <div class="footer-inner">
    <span class="footer-brand">{{ 'app.title' | transloco }}</span>
    <span class="footer-sep">·</span>
    <span class="footer-tagline">{{ 'app.tagline' | transloco }}</span>
    <span class="footer-fill"></span>
    <span class="footer-meta">{{ 'footer.version_label' | transloco }}&nbsp;{{ version }}</span>
    <span class="footer-sep">·</span>
    <span class="footer-meta footer-copyright">
      © {{ year }}
      <a href="https://www.foxugly.com" target="_blank" rel="noopener noreferrer" class="footer-author-link">
        <!-- NgOptimizedImage exemption: a 0.9rem decorative (aria-hidden) SVG with
             CSS width:auto — NgOptimizedImage targets raster LCP images and needs
             fixed intrinsic dims, which would fight this inline icon's styling.
             Same exemption rationale as the event-print QR data-URL. -->
        <img src="/foxugly-logo.svg" alt="" class="footer-author-logo" aria-hidden="true" />
        {{ 'footer.author' | transloco }}</a>
    </span>
    <span class="footer-sep">·</span>
    <a routerLink="/privacy" class="footer-meta footer-privacy-link">{{ 'footer.privacy' | transloco }}</a>
    <span class="footer-sep">·</span>
    <span class="footer-meta">{{ 'footer.rights' | transloco }}</span>
  </div>
</footer>
