<app-bell
  #bell
  icon="pi-comments"
  [label]="'messages.bell.label' | transloco"
  [count]="unreadCount()"
  panelClass="msg-popover"
  (poll)="onPoll()"
  (reset)="onReset()"
>
  <div class="msg-panel">
    <div class="msg-head">
      <span class="msg-title">{{ 'messages.bell.label' | transloco }}</span>
    </div>

    <div class="msg-list">
      @if (error() && topics().length === 0) {
        <div class="msg-empty">
          <p-message severity="error" [text]="'common.load_failed' | transloco" />
          <p-button
            [label]="'common.retry' | transloco"
            icon="pi pi-refresh"
            severity="secondary"
            [outlined]="true"
            size="small"
            (onClick)="retry()"
          />
        </div>
      } @else if (topics().length === 0) {
        <div class="msg-empty">
          <i class="pi pi-inbox" aria-hidden="true"></i>
          <span>{{ 'messages.bell.empty' | transloco }}</span>
        </div>
      } @else {
        @for (topic of topics(); track topic.topic_id) {
          <button
            type="button"
            class="msg-item"
            [attr.aria-label]="
              topic.title +
              ' · ' +
              topic.team_name +
              ' · ' +
              topic.unread_count +
              ' ' +
              ('messages.bell.unread_count' | transloco)
            "
            (click)="onSelect(topic)"
          >
            <span class="msg-dot" aria-hidden="true"></span>
            <span class="msg-body">
              <span class="msg-item-title">{{ topic.title }}</span>
              <span class="msg-item-team">{{ topic.team_name }}</span>
            </span>
            <span class="msg-item-count">{{ topic.unread_count }}</span>
          </button>
        }
      }
    </div>

    <div class="msg-foot">
      <button type="button" class="msg-viewall" (click)="viewAll()">
        {{ 'messages.bell.view_all' | transloco }}
      </button>
    </div>
  </div>
</app-bell>
