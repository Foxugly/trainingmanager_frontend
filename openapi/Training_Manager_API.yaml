  /api/v1/events/{event_pk}/attendance/:
    get:
      operationId: events_attendance_list
      description: Returns all attendance rows. Coaches see everyone; athletes see
        only their own row.
      summary: List attendance for an event
      parameters:
      - in: path
        name: event_pk
        schema:
          type: integer
        required: true
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
