      responses:
        '204':
          description: No response body
  /api/v1/events/{id}/generate-training/:
    post:
      operationId: events_generate_training_create
      description: Generate detailed Rounds and Exercises with AI for an Event.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) event.
        required: true
      tags:
      - events
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateTrainingResponse'
          description: Training session generated successfully
        '403':
          description: Not a manager of this event team
        '409':
          description: Event already has rounds
        '500':
          description: AI configuration error
        '502':
          description: AI service error
  /api/v1/exercises/:
    get:
      operationId: exercises_list
      description: CRUD complet pour Exercise.
      parameters:
      - in: query
        name: energysegment
        schema:
          type: integer
      - in: query
        name: language
        schema:
          type: string
          enum:
          - en
          - es
          - fr
          - it
          - nl
        description: |-
          * `fr` - Français
          * `nl` - Nederlands
          * `en` - English
          * `it` - Italiano
          * `es` - Español
      - in: query
        name: modality
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un terme de recherche.
        schema:
          type: string
      tags:
      - exercises
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExerciseList'
          description: ''
    post:
      operationId: exercises_create
      description: CRUD complet pour Exercise.
      tags:
