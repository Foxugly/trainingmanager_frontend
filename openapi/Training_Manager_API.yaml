            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
    patch:
      operationId: events_partial_update
      description: CRUD complet pour Event, scopé par team du program.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
