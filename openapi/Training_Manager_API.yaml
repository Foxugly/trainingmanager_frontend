            schema:
              $ref: '#/components/schemas/AttendanceStatusAdmin'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceStatusAdmin'
          description: ''
    patch:
      operationId: attendance_statuses_partial_update
      description: |-
        CRUD on the AttendanceStatus referential.

        Read: any authenticated user (default queryset filters is_active=True).
        Write: staff only. Soft delete via perform_destroy.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this attendance status.
        required: true
      - in: query
        name: include_inactive
        schema:
          type: boolean
        description: If true and the user is staff, include soft-deleted (is_active=False)
          records in the result. Silently ignored for non-staff users.
      tags:
      - attendance-statuses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAttendanceStatusAdmin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAttendanceStatusAdmin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAttendanceStatusAdmin'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceStatusAdmin'
          description: ''
    delete:
      operationId: attendance_statuses_destroy
      description: Sets is_active=False; does not hard delete.
      summary: Soft delete attendance status (staff only)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this attendance status.
        required: true
      tags:
      - attendance-statuses
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/token/:
    post:
      operationId: auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
