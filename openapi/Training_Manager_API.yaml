  /api/v1/invitations/:
    get:
      operationId: invitations_list
      description: Trainer invitation flow.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un terme de recherche.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - cancelled
          - completed
          - expired
          - pending
        description: |-
          * `pending` - Pending
          * `completed` - Completed
          * `expired` - Expired
          * `cancelled` - Cancelled
      - in: query
        name: team
        schema:
          type: integer
      tags:
      - invitations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTeamInvitationList'
          description: ''
    post:
      operationId: invitations_create
      description: Trainer pre-registers an athlete on a managed team. If the email
        matches an existing user, the response payload is {detail, member_id} instead
        of a TeamInvitation.
      tags:
      - invitations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateInvitation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateInvitation'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamInvitation'
          description: ''
  /api/v1/invitations/{id}/:
    get:
      operationId: invitations_retrieve
      description: Trainer invitation flow.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) team invitation.
        required: true
      tags:
      - invitations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamInvitation'
          description: ''
    delete:
      operationId: invitations_destroy
      description: Trainer invitation flow.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) team invitation.
        required: true
      tags:
      - invitations
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/invitations/lookup/{token}/:
    get:
      operationId: invitations_lookup_retrieve
      description: Lookup an invitation by token. No authentication required.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - invitations
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateInvitation'
          description: ''
        '400':
          description: Invitation not pending (already handled)
        '404':
          description: Token not found
        '410':
          description: Invitation expired
    post:
      operationId: invitations_lookup_create
      description: 'Finalize invitation: create the user, link Member, return JWT.'
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - invitations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteInvitation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompleteInvitation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompleteInvitation'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteInvitationResponse'
          description: User created and JWT issued
        '400':
          description: Invalid token state, username taken, or weak password
        '404':
          description: Token not found
