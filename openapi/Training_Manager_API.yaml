            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAttendanceList'
          description: ''
    post:
      operationId: events_attendance_create
      description: Member must be in the team via an active TeamMembership. Returns
        400 if a row already exists for (event, member) — use PATCH.
      summary: Create an attendance row (coach only)
      parameters:
      - in: path
        name: event_pk
        schema:
          type: integer
        required: true
      tags:
