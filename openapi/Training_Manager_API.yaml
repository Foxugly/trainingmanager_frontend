          readOnly: true
        team:
          type: integer
        message:
          type: string
      required:
      - id
      - team
    CustomUserPublic:
      type: object
      description: |-
        Public user payload for nested read contexts.

        Excludes email and other privacy-sensitive fields. Use this whenever
        a user is exposed inside another resource (Team.owner, Member.user,
        TeamInvitation.invited_by, ...).
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          title: Nom d’utilisateur
          description: Requis. 150 caractères maximum. Uniquement des lettres, nombres
            et les caractères « @ », « . », « + », « - » et « _ ».
        first_name:
          type: string
          readOnly: true
          title: Prénom
        last_name:
          type: string
          readOnly: true
          title: Nom
      required:
      - first_name
      - id
      - last_name
      - username
    EnergySegment:
