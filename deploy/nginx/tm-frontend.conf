# Training Manager frontend (Angular SPA) — nginx vhost for tm.foxugly.com.
#
# Installed to /etc/nginx/sites-available/ and symlinked into sites-enabled/ by
# deploy/setup-server.sh (and re-synced from the committed git blob on deploy).
#
# TLS: WILDCARD *.foxugly.com cert (DNS-01 via route53), referenced directly —
# NO per-subdomain certbot.
#
# Runtime config: values come from SSM via the snippet included below (written
# by fetch-frontend-runtime-from-ssm.sh) and are injected into index.html via
# sub_filter, then read by Angular (core/runtime-config.ts). No /api proxy: the
# frontend calls tm-api.foxugly.com cross-origin (CORS allowlisted on the API).

# HTTP -> HTTPS
server {
    listen 80;
    server_name tm.foxugly.com;
    return 301 https://$host$request_uri;
}

server {
    # `listen ... http2` form (nginx < 1.25.1 compatible) — consistent with the
    # other foxugly.com vhosts on this box.
    listen 443 ssl http2;
    server_name tm.foxugly.com;

    ssl_certificate     /etc/letsencrypt/live/foxugly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foxugly.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/django_websites/trainingmanager_frontend/dist/trainingmanager-frontend/browser;
    index index.html;

    client_max_body_size 5m;

    # Security headers (re-emitted in locations that set their own add_header —
    # nginx drops inherited headers as soon as a location declares add_header).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # Empty defaults: the page stays valid even without the snippet (boot before
    # the first fetch). The fetch script writes the snippet that overrides these.
    set $tm_api_base       "";
    set $tm_version        "";
    set $tm_turnstile      "";
    set $tm_sentry_dsn     "";
    set $tm_sentry_env     "production";
    set $tm_sentry_release "";
    set $tm_features       "{}";
    # CSP report directive, derived from the Sentry DSN by the runtime-fetch
    # script (e.g. "; report-uri https://…/security/?sentry_key=…"). Empty when
    # no DSN → the CSP simply carries no report-uri.
    set $tm_csp_report     "";
    include /etc/nginx/snippets/tm-frontend-runtime*.conf;   # glob tolerates absence

    # SPA routing: any unknown path falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html never cached (references hashed bundles that change each deploy)
    # + runtime globals injected just before </head>.
    location = /index.html {
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control             "no-store, no-cache, must-revalidate" always;
        expires 0;

        # Content-Security-Policy — PHASE 2 ENFORCED (the Report-Only window was
        # clean across login/magic-link, Turnstile register+forgot, Quill
        # discussions/freeform/debrief, chart.js stats/dashboard and team logos —
        # no violations observed 2026-06-11, so flipped from Report-Only to
        # enforce). Strict script-src (no 'unsafe-inline'): the ONLY inline script
        # is the runtime-config block injected below, which carries a per-request
        # nonce ($request_id, same value reused in the header). AOT build => no
        # JIT, so no 'unsafe-eval' needed. style-src keeps 'unsafe-inline'
        # because Angular emulated-encapsulation + PrimeNG/Quill inject runtime
        # <style> (injected CSS can't exfiltrate a token, so this is acceptable).
        # connect-src: own API (cross-subdomain) + Sentry ingest. frame-src +
        # script-src: Cloudflare Turnstile.
        # Rollback if a missed flow breaks: rename this header back to
        # Content-Security-Policy-Report-Only and redeploy.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'nonce-$request_id' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://tm-api.foxugly.com https://*.ingest.de.sentry.io; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:$tm_csp_report" always;

        # index.html is rewritten by sub_filter -> not pre-compressable; compress
        # dynamically (tiny file, negligible cost).
        brotli on;
        gzip on;

        # $tm_features injected WITHOUT quotes -> literal JS object. The script
        # carries nonce="$request_id" matching the CSP header above so a strict
        # script-src admits this one legitimate inline block.
        sub_filter '</head>' '<script nonce="$request_id">window.__TM_API_BASE_URL="$tm_api_base";window.__TM_VERSION="$tm_version";window.__TM_TURNSTILE_SITE_KEY="$tm_turnstile";window.__TM_SENTRY_DSN="$tm_sentry_dsn";window.__TM_SENTRY_ENV="$tm_sentry_env";window.__TM_SENTRY_RELEASE="$tm_sentry_release";window.__TM_FEATURES=$tm_features;</script></head>';
        sub_filter_once on;
    }

    # i18n catalogs (/i18n/*.json): NOT content-hashed, so they must never be
    # served stale after a deploy (else Transloco shows raw keys until the cache
    # expires). Always revalidate against the ETag — cheap 304 when unchanged,
    # fresh content the moment a deploy changes them.
    location ~* ^/i18n/.+\.json$ {
        brotli_static on;
        gzip_static on;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control             "no-cache" always;
        etag on;
        try_files $uri =404;
    }

    # Hashed bundles (chunk-XXXX.js, styles-XXXX.css, fonts…): immutable cache.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        # Serve the build-time .br/.gz precompressed (scripts/precompress.mjs),
        # zero on-the-fly recompression. If absent (woff2, images), nginx serves
        # the original. brotli_static adds Vary: Accept-Encoding.
        brotli_static on;
        gzip_static on;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control             "public, max-age=31536000, immutable" always;
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    access_log /var/log/nginx/tm-frontend-access.log;
    error_log  /var/log/nginx/tm-frontend-error.log;
}
