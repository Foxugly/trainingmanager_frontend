# Training Manager frontend (Angular SPA) — nginx vhost for tm.foxugly.com.
#
# Installed to /etc/nginx/sites-available/ and symlinked into sites-enabled/ by
# deploy/setup-server.sh (and re-synced from the committed git blob on deploy).
#
# TLS: WILDCARD *.foxugly.com cert (DNS-01 via route53), referenced directly —
# NO per-subdomain certbot.
#
# Runtime config: values come from SSM via the snippet included below (written
# by fetch-frontend-runtime-from-ssm.sh) and are injected into index.html via
# sub_filter, then read by Angular (core/runtime-config.ts). No /api proxy: the
# frontend calls tm-api.foxugly.com cross-origin (CORS allowlisted on the API).

# HTTP -> HTTPS
server {
    listen 80;
    server_name tm.foxugly.com;
    return 301 https://$host$request_uri;
}

server {
    # `listen ... http2` form (nginx < 1.25.1 compatible) — consistent with the
    # other foxugly.com vhosts on this box.
    listen 443 ssl http2;
    server_name tm.foxugly.com;

    ssl_certificate     /etc/letsencrypt/live/foxugly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foxugly.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/django_websites/trainingmanager_frontend/dist/trainingmanager-frontend/browser;
    index index.html;

    client_max_body_size 5m;

    # Security headers (re-emitted in locations that set their own add_header —
    # nginx drops inherited headers as soon as a location declares add_header).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # Empty defaults: the page stays valid even without the snippet (boot before
    # the first fetch). The fetch script writes the snippet that overrides these.
    set $tm_api_base       "";
    set $tm_version        "";
    set $tm_sentry_dsn     "";
    set $tm_sentry_env     "production";
    set $tm_sentry_release "";
    set $tm_features       "{}";
    include /etc/nginx/snippets/tm-frontend-runtime*.conf;   # glob tolerates absence

    # SPA routing: any unknown path falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html never cached (references hashed bundles that change each deploy)
    # + runtime globals injected just before </head>.
    location = /index.html {
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control             "no-store, no-cache, must-revalidate" always;
        expires 0;

        # index.html is rewritten by sub_filter -> not pre-compressable; compress
        # dynamically (tiny file, negligible cost).
        brotli on;
        gzip on;

        # $tm_features injected WITHOUT quotes -> literal JS object.
        sub_filter '</head>' '<script>window.__TM_API_BASE_URL="$tm_api_base";window.__TM_VERSION="$tm_version";window.__TM_SENTRY_DSN="$tm_sentry_dsn";window.__TM_SENTRY_ENV="$tm_sentry_env";window.__TM_SENTRY_RELEASE="$tm_sentry_release";window.__TM_FEATURES=$tm_features;</script></head>';
        sub_filter_once on;
    }

    # Hashed bundles (chunk-XXXX.js, styles-XXXX.css, fonts…): immutable cache.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        # Serve the build-time .br/.gz precompressed (scripts/precompress.mjs),
        # zero on-the-fly recompression. If absent (woff2, images), nginx serves
        # the original. brotli_static adds Vary: Accept-Encoding.
        brotli_static on;
        gzip_static on;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control             "public, max-age=31536000, immutable" always;
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    access_log /var/log/nginx/tm-frontend-access.log;
    error_log  /var/log/nginx/tm-frontend-error.log;
}
